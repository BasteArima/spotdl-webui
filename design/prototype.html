<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Музыка — прототип</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Прототип нового интерфейса. Данные выдуманные, ничего не скачивает.
   Тема: системная, либо принудительно через data-theme на <html>. */
:root {
  --bg: #f5f5f7; --card: #ffffff; --card2: #fafafa; --fill: rgba(118,118,128,.12); --fill2: rgba(118,118,128,.20);
  --text: #1d1d1f; --text2: #6e6e73; --text3: #a1a1a6; --sep: rgba(60,60,67,.12);
  --accent: #1f8f4e; --accent-soft: rgba(31,143,78,.12); --on-accent: #fff;
  --orange: #c2600a; --orange-soft: rgba(255,149,0,.14); --red: #d70015; --red-soft: rgba(255,59,48,.12);
  --blue: #0066cc; --blue-soft: rgba(0,122,255,.12);
  --spotify: #1db954; --ytm: #ff0033; --deezer: #a238ff; --manual: #8e8e93;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 12px rgba(0,0,0,.05);
  --r: 12px; --r-sm: 8px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f0f11; --card: #1c1c1e; --card2: #232326; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.34);
  --text: #f5f5f7; --text2: #a1a1a6; --text3: #6e6e73; --sep: rgba(255,255,255,.09);
  --accent: #30d158; --accent-soft: rgba(48,209,88,.16); --on-accent: #0b2a15;
  --orange: #ff9f0a; --orange-soft: rgba(255,159,10,.16); --red: #ff453a; --red-soft: rgba(255,69,58,.16);
  --blue: #409cff; --blue-soft: rgba(10,132,255,.18);
  --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f0f11; --card: #1c1c1e; --card2: #232326; --fill: rgba(118,118,128,.24); --fill2: rgba(118,118,128,.34);
  --text: #f5f5f7; --text2: #a1a1a6; --text3: #6e6e73; --sep: rgba(255,255,255,.09);
  --accent: #30d158; --accent-soft: rgba(48,209,88,.16); --on-accent: #0b2a15;
  --orange: #ff9f0a; --orange-soft: rgba(255,159,10,.16); --red: #ff453a; --red-soft: rgba(255,69,58,.16);
  --blue: #409cff; --blue-soft: rgba(10,132,255,.18);
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; }
.i { font-size: 18px; line-height: 1; vertical-align: -3px; }

/* --- каркас --- */
.app { display: flex; min-height: 100vh; }
.side { width: 232px; flex: none; position: sticky; top: 0; height: 100vh; padding: 18px 12px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--sep); background: var(--bg); }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 600; font-size: 17px; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r-sm); color: var(--text); cursor: pointer; border: 0; background: none; text-align: left; width: 100%; }
.nav-item:hover { background: var(--fill); }
.nav-item.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .count { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--orange); background: var(--orange-soft); padding: 1px 7px; border-radius: 10px; }
.side .grow { flex: 1; }
.side-status { font-size: 12px; color: var(--text2); padding: 10px; border-radius: var(--r-sm); background: var(--fill); }
.main { min-width: 0; padding: 26px 32px 60px; max-width: 1080px; margin: 0 auto; }
.topbar { display: none; }
.tabbar { display: none; }

h1 { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 4px; }
h2 { font-size: 19px; font-weight: 600; margin: 28px 0 10px; letter-spacing: -.01em; }
.sub { color: var(--text2); margin: 0 0 18px; }
.muted { color: var(--text2); } .small { font-size: 13px; } .tiny { font-size: 12px; }

/* --- элементы --- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }
.grid { display: grid; gap: 12px; }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row { display: flex; align-items: center; gap: 12px; }
.list > .li { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--sep); min-height: 54px; }
.list > .li:first-child { border-top: 0; }
.li .grow, .grow { flex: 1; min-width: 0; }
.ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.li.click { cursor: pointer; } .li.click:hover { background: var(--fill); }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 16px; border: 0; background: var(--fill); cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill2); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.tinted { background: var(--accent-soft); color: var(--accent); }
.btn.sm { height: 28px; padding: 0 11px; font-size: 13px; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.ghost { background: none; color: var(--accent); }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.done { background: var(--accent-soft); color: var(--accent); cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 10px; background: var(--fill); color: var(--text2); white-space: nowrap; }
.chip.ok { background: var(--accent-soft); color: var(--accent); }
.chip.warn { background: var(--orange-soft); color: var(--orange); }
.chip.err { background: var(--red-soft); color: var(--red); }
.chip.info { background: var(--blue-soft); color: var(--blue); }
.src { width: 18px; height: 18px; border-radius: 5px; display: inline-grid; place-items: center; color: #fff; font-size: 12px; flex: none; }
.src.spotify { background: var(--spotify); } .src.ytm { background: var(--ytm); } .src.deezer { background: var(--deezer); } .src.manual { background: var(--manual); }
.srcs { display: inline-flex; gap: 3px; }
.cover { width: 44px; height: 44px; border-radius: 7px; flex: none; display: grid; place-items: center; color: rgba(255,255,255,.9); font-weight: 600; font-size: 15px; }
.cover.lg { width: 132px; height: 132px; border-radius: 12px; font-size: 40px; }
.cover.md { width: 56px; height: 56px; border-radius: 9px; }
.bar { height: 6px; border-radius: 3px; background: var(--fill); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }
.search { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); border: 1px solid var(--sep); }
.search input { flex: 1; border: 0; outline: 0; background: none; font: inherit; font-size: 16px; color: var(--text); min-width: 0; }
.search input::placeholder { color: var(--text3); }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--fill); gap: 2px; }
.seg button { white-space: nowrap; border: 0; background: none; padding: 5px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text); }
.seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stat .n { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
.toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--fill2); position: relative; cursor: pointer; border: 0; flex: none; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .2s; }
.toggle.on { background: var(--accent); } .toggle.on::after { left: 20px; }
.field { height: 34px; border-radius: var(--r-sm); border: 1px solid var(--sep); background: var(--card2); padding: 0 10px; font: inherit; color: var(--text); width: 100%; }
.section-label { font-size: 13px; color: var(--text2); text-transform: none; margin: 22px 4px 6px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text2); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 20px; font-size: 14px; transition: .25s; pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%); }
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.hl { background: var(--orange-soft); border-radius: 3px; }
.dup { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 12px; align-items: center; }
.dup .side-a, .dup .side-b { background: var(--card2); border-radius: var(--r-sm); padding: 10px 12px; }
.play { width: 28px; height: 28px; border-radius: 50%; border: 0; background: var(--fill); cursor: pointer; display: grid; place-items: center; flex: none; }
.log { font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--card2); border-radius: var(--r-sm); padding: 10px 12px; margin: 0 16px 12px; white-space: pre-wrap; color: var(--text2); }
.pl-head { display: flex; gap: 20px; align-items: flex-end; margin-bottom: 18px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); cursor: pointer; margin-bottom: 12px; font-size: 14px; background: none; border: 0; padding: 0; }
.hide-m { }
.select { height: 28px; border-radius: 14px; border: 0; background: var(--fill); color: var(--text); font: inherit; font-size: 13px; padding: 0 10px; cursor: pointer; }
.miss-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.miss-hint { flex-basis: 100%; padding-left: 56px; margin-top: -2px; }

/* --- телефон --- */
@media (max-width: 860px) {
  .side { display: none; }
  .main { padding: 8px 16px 96px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .topbar .t { font-weight: 600; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--sep); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); z-index: 10; }
  .tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10.5px; color: var(--text2); cursor: pointer; padding: 4px 0; position: relative; }
  .tabbar button .i { font-size: 23px; }
  .tabbar button.on { color: var(--accent); }
  .tabbar .dot { position: absolute; top: 2px; left: calc(50% + 8px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
  h1 { font-size: 26px; }
  .g3 { grid-template-columns: 1fr; }
  .g2 { grid-template-columns: 1fr; }
  .hide-m { display: none !important; }
  .cover.lg { width: 96px; height: 96px; font-size: 30px; }
  .pl-head { gap: 14px; }
  .dup { grid-template-columns: 1fr; }
  .dup .vs { justify-self: center; transform: rotate(90deg); }
  .list > .li { padding: 10px 14px; }
  .miss-actions { flex-basis: 100%; justify-content: flex-start; padding-left: 0; }
  .miss-hint { padding-left: 0; }
}
</style>
</head>

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function go(view, extra) { if (view === "settings") state.setPage = null; state.view = view; if (extra) Object.assign(state, extra); location.hash = view + (state.pl && view === "playlist" ? "/" + state.pl : ""); render(); window.scrollTo(0, 0); }
function dlButton(key, label = "Скачать") {
  const s = state.dl[key];
  if (s === "run") return `<button class="btn sm"><span class="spin"><i class="ti ti-loader-2 i"></i></span>Качаю…</button>`;
  if (s === "done") return `<button class="btn sm done"><i class="ti ti-check i"></i>В библиотеке</button>`;
  return `<button class="btn sm tinted" onclick="fakeDownload('${key}')"><i class="ti ti-download i"></i>${label}</button>`;
}
function fakeDownload(key) { state.dl[key] = "run"; render(); setTimeout(() => { state.dl[key] = "done"; render(); toast("Скачано и добавлено в библиотеку"); }, 1600); }

// ---------------------------------------------------------------- навигация
function renderNav() {
  $("#nav").innerHTML = NAV.map((n) => {
    const c = n.count ? n.count() : 0;
    const on = state.view === n.id || (n.id === "playlists" && state.view === "playlist");
    return `<button class="nav-item ${on ? "on" : ""}" onclick="go('${n.id}')"><i class="ti ${n.icon} i"></i>${n.title}${c ? `<span class="count">${c}</span>` : ""}</button>`;
  }).join("");
  $("#side-status").innerHTML = `<div class="row" style="gap:8px;margin-bottom:6px"><span class="spin" style="color:var(--accent)"><i class="ti ti-refresh i" style="font-size:15px"></i></span><b style="color:var(--text);font-weight:600">Синк Evangelion</b></div><div class="bar"><i style="width:49%"></i></div><div style="margin-top:6px">212 из 437 · ещё ~6 мин</div>`;
  const att = NAV.find((n) => n.id === "attention").count();
  const tabDef = { home: ["Главная", "ti-home"], search: ["Поиск", "ti-search"], playlists: ["Плейлисты", "ti-playlist"], attention: ["Внимание", "ti-alert-circle"], more: ["Ещё", "ti-dots"] };
  const moreViews = ["library", "quality", "discover", "activity", "settings", "more"];
  $("#tabbar").innerHTML = TABS.map((t) => {
    const on = state.view === t || (t === "playlists" && state.view === "playlist") || (t === "more" && moreViews.includes(state.view));
    return `<button class="${on ? "on" : ""}" onclick="go('${t}')"><i class="ti ${tabDef[t][1]} i"></i>${tabDef[t][0]}${t === "attention" && att ? `<span class="dot">${att}</span>` : ""}</button>`;
  }).join("");
  const title = (NAV.find((n) => n.id === state.view) || { title: state.view === "more" ? "Ещё" : state.view === "playlist" ? "Плейлист" : "" }).title;
  $("#top-title").textContent = title;
}

const AUDIO = [["auto", "Авто"], ["deezer", "Deezer"], ["spotify", "Spotify 320k"], ["youtube", "Своя ссылка YouTube"], ["file", "Свой файл"]];
function audioHint(m, pick) {
  return {
    auto: m.deezer ? "Deezer по ISRC (320k), не выйдет — Spotify 320k" : "на Deezer нет — возьмёт Spotify 320k",
    deezer: m.deezer ? "найден по ISRC · mp3 320k · секунды" : "на Deezer этого трека нет",
    spotify: "прямо со Spotify · 320k · со скоростью прослушивания, ~" + (m.len || "4 мин"),
    youtube: "найдите ролик сами — «искать на YouTube ↗» — и вставьте ссылку",
    file: "свой mp3/flac/m4a — теги и обложка подтянутся со Spotify",
  }[pick];
}
function missingRow(m, key) {
  const pick = state.pick[key] || "auto";
  const s = state.dl[key];
  const extra = pick === "youtube" ? `<div class="row miss-hint" style="gap:10px;flex-wrap:wrap"><input class="field" style="max-width:340px;height:30px;flex:1;min-width:180px" placeholder="https://music.youtube.com/watch?v=…"><a class="tiny" href="https://music.youtube.com/search?q=${encodeURIComponent(m.a + " " + m.t)}" target="_blank" rel="noopener">искать на YouTube ↗</a></div>`
    : pick === "file" ? `<div class="row miss-hint" style="gap:10px"><button class="btn sm"><i class="ti ti-upload i"></i>Выбрать файл</button><span class="tiny muted">mp3, flac, m4a, opus — теги и обложка подтянутся со Spotify</span></div>` : "";
  const select = `<select class="select" onchange="state.pick['${key}']=this.value;renderMain()">${AUDIO.map(([k, l]) => `<option value="${k}" ${k === pick ? "selected" : ""}>${l}</option>`).join("")}</select>`;
  const actions = s === "run" ? `<button class="btn sm"><span class="spin"><i class="ti ti-loader-2 i"></i></span>Качаю…</button>`
    : s === "done" ? `<button class="btn sm done"><i class="ti ti-check i"></i>В библиотеке</button>`
    : `${select}<button class="btn sm tinted" onclick="fakeDownload('${key}')"><i class="ti ti-download i"></i>Скачать</button>`;
  return `<div class="li" style="flex-wrap:wrap">${cover(m.t)}<div class="grow"><div class="ellip">${esc(m.t)}</div><div class="tiny muted ellip">${esc(m.a)} · «${esc(m.pl)}» · ${m.why}</div></div>
    ${m.retry ? `<span class="chip">повторится при синке</span>` : `<div class="miss-actions">${actions}</div>${s ? "" : extra || `<div class="tiny muted miss-hint">${audioHint(m, pick)}</div>`}`}</div>`;
}

  const t = state.attnTab;
  const dupLeft = DUPES.map((d, i) => ({ d, i })).filter(({ i }) => !state.resolved.has("d" + i));
  const tabs = `<div class="seg" style="margin-bottom:16px">${[["missing", `Не скачано · ${MISSING.length}`], ["dupes", `Дубли · ${dupLeft.length}`], ["sources", "Источники · 1"]].map(([k, l]) => `<button class="${t === k ? "on" : ""}" onclick="state.attnTab='${k}';renderMain()">${l}</button>`).join("")}</div>`;
  let body = "";
  if (t === "missing") {
    body = `${bulkBar("all", MISSING)}<div class="card list">${MISSING.map((m, i) => missingRow(m, "m" + i)).join("")}</div>
    <p class="tiny muted" style="margin-top:10px">Синк плейлистов берёт звук с YouTube Music. Сюда попадает то, чего там не нашлось, — у каждого трека можно выбрать, откуда его взять.</p>`;
  } else if (t === "dupes") {
    body = dupLeft.length ? dupLeft.map(({ d, i }) => `<div class="card pad" style="margin-bottom:12px">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><span class="small muted">${d.why}</span><span class="chip ${d.score >= 90 ? "ok" : "warn"}">совпадение ${d.score}%</span></div>
      <div class="dup"><div class="side-a">${dupSide(d.a)}</div><i class="ti ti-arrows-left-right i muted vs"></i><div class="side-b">${dupSide(d.b)}</div></div>
      <div class="row" style="gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn primary sm" onclick="resolveDup(${i},'Склеено: оставлен файл в лучшем качестве')"><i class="ti ti-link i"></i>Один трек — оставить ${d.b.q}</button><button class="btn sm" onclick="resolveDup(${i},'Оставлены оба трека')">Разные треки</button><button class="btn ghost sm" onclick="toast('Прослушать оба')"><i class="ti ti-headphones i"></i>Сравнить на слух</button></div></div>`).join("")
      : `<div class="card empty"><i class="ti ti-circle-check" style="font-size:40px;color:var(--accent)"></i><div style="margin-top:8px">Все возможные дубли разобраны</div></div>`;
  } else {
    body = `<div class="card list"><div class="li">${cover("Daily Mix 1", "md")}<div class="grow"><div style="font-weight:500">Daily Mix 1</div><div class="tiny muted">Spotify собирает эту подборку лично для вас и не отдаёт её через API. Сохраните нужные треки в свой плейлист — он синкается.</div></div><button class="btn sm" onclick="toast('Плейлист удалён из списка')">Убрать</button></div></div>`;
  }
  return `<h1>Внимание</h1><p class="sub">То, что сервис не может решить сам</p>` + tabs + body;
}
function dupSide(s) { return `<div class="row" style="gap:10px">${cover(s.t)}<div class="grow"><div class="ellip">${esc(s.t)}</div><div class="tiny muted ellip">${esc(s.ar)} · ${s.d} · ${s.q}</div></div>${srcIcon(s.src)}</div>`; }
function resolveDup(i, msg) { state.resolved.add("d" + i); render(); toast(msg); }

    if (item) return `<button class="back" onclick="state.setPage=null;renderMain()"><i class="ti ti-chevron-left i"></i>Настройки</button><h1>${item.title}</h1>${item.body()}`;

  return `<h1>Настройки</h1><p class="sub">Все текущие настройки сервиса — по смыслу, в подстраницах</p>
  <div class="section-label">Внешний вид</div><div class="card list">${setRow("ti-sun-moon", "Тема", "", `<div class="seg">${[["auto", "Авто"], ["light", "Светлая"], ["dark", "Тёмная"]].map(([k, l]) => `<button class="${theme === k ? "on" : ""}" onclick="setTheme('${k}')">${l}</button>`).join("")}</div>`)}</div>
  ${SETTINGS.map((g) => `<div class="section-label">${g.label}</div><div class="card list">${g.items.map((it) => `<div class="li click" onclick="state.setPage='${it.id}';renderMain();scrollTo(0,0)"><i class="ti ${it.icon} i muted"></i><div class="grow"><div>${it.title}</div><div class="tiny muted ellip">${it.sub}</div></div>${it.chip ? `<span class="chip ok hide-m">${it.chip}</span>` : ""}<i class="ti ti-chevron-right i muted"></i></div>`).join("")}</div>`).join("")}`;
}
function viewMore() {
  const items = [["library", "Библиотека", "ti-vinyl"], ["quality", "Качество 320k", "ti-arrow-big-up-lines"], ["discover", "Открытия", "ti-sparkles"], ["activity", "Активность", "ti-history"], ["settings", "Настройки", "ti-settings"]];
  return `<h1>Ещё</h1><div class="card list" style="margin-top:14px">${items.map(([v, t, ic]) => `<div class="li click" onclick="go('${v}')"><i class="ti ${ic} i" style="color:var(--accent)"></i><div class="grow">${t}</div><i class="ti ti-chevron-right i muted"></i></div>`).join("")}</div>`;
}
function setTheme(k) { if (k === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k; try { localStorage.setItem("proto-theme", k); } catch (e) {} render(); }

// ---------------------------------------------------------------- рендер
const VIEWS = { home: viewHome, search: viewSearch, playlists: viewPlaylists, playlist: viewPlaylist, library: viewLibrary, attention: viewAttention, discover: viewDiscover, activity: viewActivity, settings: viewSettings, more: viewMore, quality: viewQuality };
function renderMain(keepFocus) {
  const pos = keepFocus && document.activeElement && document.activeElement.id === "q" ? document.activeElement.selectionStart : null;
  $("#main").innerHTML = (VIEWS[state.view] || viewHome)();
  if (state.view === "search") { const q = $("#q"); if (q && (pos !== null || !keepFocus)) { q.focus(); if (pos !== null) q.setSelectionRange(pos, pos); } }
}
function render() { renderNav(); renderMain(); }
try { const t = localStorage.getItem("proto-theme"); if (t && t !== "auto") document.documentElement.dataset.theme = t; } catch (e) {}
function fromHash() { const [v, pl] = (location.hash.slice(1) || "home").split("/"); if (!VIEWS[v]) return false; const changed = v !== state.view || (pl || null) !== (v === "playlist" ? state.pl : null); state.view = v; if (pl) state.pl = pl; return changed; }
window.addEventListener("hashchange", () => { if (fromHash()) { render(); window.scrollTo(0, 0); } });
fromHash();
render();
</script>
</body>
