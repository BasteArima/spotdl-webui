services:
  music-webui:
    image: ghcr.io/bastearima/spotdl-webui:latest
    container_name: spotdl-webui
    pull_policy: always
    restart: unless-stopped
    ports:
      - "4535:8000"
    environment:
      - PUID=998
      - PGID=100
      - WEB_PORT=8000
      - APP_AUTH_TOKEN=password
      # Фоновый автосинк (замена старого контейнера-автосинка). 0 = выключить.
      - AUTOSYNC_INTERVAL_HOURS=24
      - AUTOSYNC_ON_START=false
      # Deezer-фолбэк (для треков, которых нет на YouTube). ARL — секрет уровня
      # пароля; лучше класть файлом в /conf/deezer_arl.txt, а не сюда. Либо:
      # - DEEZER_ARL=твой_arl_токен
      # Zotify (реальное аудио со Spotify, 320k с Premium). Лучше положить
      # /conf/zotify_credentials.json. Параметры по желанию:
      # - ZOTIFY_QUALITY=very_high
      # - ZOTIFY_REAL_TIME=false
    volumes:
      - "/srv/dev-disk-by-uuid-6c40d758-c9b4-46dc-a0b1-84826fd43804/data/spotdl:/conf"
      - "/srv/dev-disk-by-uuid-be7624de-4d24-4133-b0b5-8e3cd8548788/storage/music:/music"
