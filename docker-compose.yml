services:
  music-webui:
    image: ghcr.io/bastearima/spotdl-webui:latest
    container_name: spotdl-webui
    pull_policy: always
    restart: unless-stopped
    # Потолок ресурсов: внутри контейнера живут не только веб, но и spotdl,
    # ffmpeg, deno и librespot-воркер — без лимита пик их суммы упирается в
    # свободную память хоста. 1 ГБ хватает на синк большого плейлиста.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2.0
    # Логи контейнера иначе растут без предела (webui дублирует туда весь
    # вывод spotdl построчно).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "4535:8000"
    environment:
      - PUID=998
      - PGID=100
      - WEB_PORT=8000
      #
      # Вход в webui. Пароль можно задать здесь (старое имя APP_AUTH_TOKEN тоже
      # работает) — иначе webui попросит придумать его при первом открытии.
      # Если порт смотрит в интернет — задайте пароль здесь заранее.
      # - APP_PASSWORD=придумайте_пароль
      # Вход без пароля — ТОЛЬКО для закрытой локальной сети:
      # - AUTH_ENABLED=false
      #
      # --- ВСЁ НИЖЕ ОПЦИОНАЛЬНО и настраивается во вкладке «Настройки» webui ---
      # Значение отсюда — это значение ПО УМОЛЧАНИЮ, UI его переопределяет.
      # Секреты (DEEZER_ARL, SPOTIFY_CLIENT_*) наоборот: заданные здесь важнее UI.
      #
      # Фоновый автосинк. 0 = выключить.
      # - AUTOSYNC_INTERVAL_HOURS=24
      # - AUTOSYNC_ON_START=false
      #
      # Deezer-фолбэк (треки, которых нет на YouTube). ARL — секрет уровня пароля;
      # лучше класть файлом в /conf/deezer_arl.txt, а не сюда. Либо:
      # - DEEZER_ARL=твой_arl_токен
      #
      # Spotify напрямую (librespot, 320k с Premium): кнопка «Spotify 320k» и
      # апгрейд качества. Креды — файлом /conf/zotify_credentials.json
      # (docs/sources.md, «Spotify напрямую»). Параметры:
      # - ZOTIFY_QUALITY=very_high     # very_high=320k, high=160k, normal=96k
      #
      # Liked Songs (плейлист со ссылкой `saved`): своё Spotify-приложение и
      # один вход — всё во вкладке «Настройки» webui (docs/sources.md, «Liked Songs»).
      # Client ID/secret можно задать и здесь; env, если задан, важнее UI:
      # - SPOTIFY_CLIENT_ID=...
      # - SPOTIFY_CLIENT_SECRET=...
      #
      # Пересканирование Navidrome после синка (обычно — вкладка «Настройки»).
      # Адрес — IP сервера, не localhost; пользователь — админ Navidrome:
      # - NAVIDROME_URL=http://192.168.1.10:4533
      # - NAVIDROME_USER=admin
      # - NAVIDROME_PASSWORD=...
      #
      # Безопасный режим (анти-бан) = качать в REAL-TIME (скорость прослушивания).
      # Массовая закачка и апгрейд — всегда real-time; одиночные — при вкл. галочке.
      # По умолчанию включён; тумблер есть в UI. При вкл. режиме у массовой
      # закачки ещё idle-пауза между треками (апгрейд — всегда):
      # - ZOTIFY_SAFE_MODE=true
      # - ZOTIFY_BULK_WAIT_MIN=5       # мин. пауза (сек) между треками
      # - ZOTIFY_BULK_WAIT_MAX=15      # макс. пауза (сек); 0 = без паузы
      #
      # Битрейт mp3 (заливка/Deezer/апгрейд). 320k — максимум Spotify.
      # - UPLOAD_BITRATE=320k
      #
      # Параллельность spotdl. По умолчанию 2 (на каждую загрузку — свой ffmpeg,
      # 4 потока забивают все ядра NAS). Больше — быстрее, но CPU выше:
      # - SPOTDL_THREADS=2
      #
      # Апгрейд качества до 320k (вкладка «Апгрейд 320k»):
      # - UPGRADE_MIN_BITRATE=300      # пропускать файлы, что уже >= этого (kbps)
      # - UPGRADE_PER_DAY=0            # лимит загрузок в сутки (0 = без лимита)
    volumes:
      - "/srv/dev-disk-by-uuid-6c40d758-c9b4-46dc-a0b1-84826fd43804/data/spotdl:/conf"
      - "/srv/dev-disk-by-uuid-be7624de-4d24-4133-b0b5-8e3cd8548788/storage/music:/music"
