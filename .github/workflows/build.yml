name: build-and-push

# Собирает Docker-образ и публикует в GHCR при push в main/master.
#
# Используется обычный `docker build` (BuildKit встроен в раннер) + inline-кэш
# из самого GHCR. Это НЕ требует docker/setup-buildx-action, который тянет образ
# moby/buildkit с Docker Hub и иногда падает по таймауту (context deadline
# exceeded к auth.docker.io). Так сборка не зависит от флакости Docker Hub, а
# кэш слоёв между прогонами сохраняется через предыдущий :latest.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          set -eu
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA="${GITHUB_SHA::7}"
          echo "Image: $IMAGE  (tags: latest, $SHA)"
          # тёплый кэш: подтягиваем прошлый образ как источник слоёв (не критично)
          docker pull "$IMAGE:latest" || true
          docker build \
            --cache-from "$IMAGE:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            -t "$IMAGE:latest" \
            -t "$IMAGE:$SHA" \
            .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA"

      # Необязательно: автоперезапуск стека в Portainer после сборки.
      # Создай webhook у стека (Stack -> Webhooks) и добавь URL в Secrets как PORTAINER_WEBHOOK.
      - name: Trigger Portainer redeploy (optional)
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsSL -X POST "$HOOK"
