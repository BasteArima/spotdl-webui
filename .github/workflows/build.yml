name: build-and-push

# Собирает Docker-образ и публикует его в GitHub Container Registry (GHCR)
# при каждом push в main/master. Вручную — через кнопку Run workflow.
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "README.md"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Имя образа = ghcr.io/<owner>/<repo>, приводится к нижнему регистру автоматически.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Необязательно: автоперезапуск стека в Portainer сразу после сборки.
      # Чтобы включить — создайте webhook у стека в Portainer (Stack -> Webhooks)
      # и добавьте его URL в Secrets репозитория как PORTAINER_WEBHOOK.
      - name: Trigger Portainer redeploy (optional)
        env:
          HOOK: ${{ secrets.PORTAINER_WEBHOOK }}
        if: ${{ env.HOOK != '' }}
        run: curl -fsSL -X POST "$HOOK"
